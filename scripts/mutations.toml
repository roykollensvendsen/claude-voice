# Every rule this project enforces, and the one line that carries it.
#
# A rule nothing catches is a rule nothing protects. `scripts/mutate.py` turns
# each of these off in turn and runs the suite; a rule whose removal breaks no
# test has no test. Add a test of your own that counts the rules in the source
# against the rows here, so this list cannot fall behind.
#
# `find` is a regular expression matching the single line to replace; `replace`
# is what replaces it, keeping the file valid. The line's own indentation is
# kept, so do not write indentation here.
#
# [[rule]]
# name = "what the rule says, in words"
# file = "src/claude_voice/somewhere.py"
# find = 'if limit_exceeded:'
# replace = 'if False:'

[[rule]]
name = "an api key in the environment stops the bridge from starting"
file = "src/claude_voice/server.py"
find = 'if env.get\("ANTHROPIC_API_KEY"\) and env.get\("CLAUDE_VOICE_ALLOW_API_KEY"\) != "1":'
replace = 'if False:'

[[rule]]
name = "a project outside the root is refused"
file = "src/claude_voice/sessions.py"
find = 'if path != self.root and self.root not in path.parents:'
replace = 'if False:'

[[rule]]
name = "an approval nobody answers is refused"
file = "src/claude_voice/approvals.py"
find = 'return PermissionResultDeny\(message="Not approved in time; the user did not answer."\)'
replace = 'return PermissionResultAllow()'

[[rule]]
name = "only a session the bridge started itself is ever stopped"
file = "src/claude_voice/server.py"
find = 'if not store.was_started\(sid\):'
replace = 'if False:'

[[rule]]
name = "an access-token lifetime that is not a whole number of at least a minute stops the bridge"
file = "src/claude_voice/server.py"
find = 'if not ttl.isdigit\(\) or int\(ttl\) < MIN_ACCESS_TTL:'
replace = 'if False:'

[[rule]]
name = "only a well-formed model name and a known effort reach Claude Code"
file = "src/claude_voice/server.py"
find = 'if model is not None and not transcripts\.MODEL_NAME\.fullmatch\(model\):'
replace = 'if False:'

[[rule]]
name = "a reply is final only once the turn has ended"
file = "src/claude_voice/server.py"
find = '"reply_final": bool\(new\) and status in'
replace = '"reply_final": True,'

[[rule]]
name = "guessing the secret on the page stops after five wrong tries"
file = "src/claude_voice/api.py"
find = 'if len\(self\._failures\) >= MAX_FAILURES:'
replace = 'if False:'

[[rule]]
name = "a new sign-in attempt does not reset the count of wrong secrets"
file = "src/claude_voice/oauth.py"
find = 'return len\(self\._failures\) >= MAX_FAILURES'
replace = 'return False'

[[rule]]
name = "an app that never signs in is forgotten after an hour"
file = "src/claude_voice/oauth.py"
find = 'self\.db\.execute\(FORGET_UNUSED, '
replace = 'pass'

[[rule]]
name = "registering stops while twenty apps wait to sign in"
file = "src/claude_voice/oauth.py"
find = 'if waiting >= MAX_UNUSED_CLIENTS:'
replace = 'if False:'

[[rule]]
name = "a sign-in is refused while twenty are open"
file = "src/claude_voice/oauth.py"
find = 'if len\(self\._consents\) >= MAX_OPEN_SIGN_INS:'
replace = 'if False:'

[[rule]]
name = "a change sent from another site is refused"
file = "src/claude_voice/api.py"
find = 'if not self\._same_site\(request\):  # a page elsewhere'
replace = 'if False:'

[[rule]]
name = "only an origin named in the settings may call across sites"
file = "src/claude_voice/server.py"
find = 'allow_origins=list\(ui_origins\),'
replace = 'allow_origins=["*"],'

[[rule]]
name = "a contribute session never pushes to the upstream repository"
file = "src/claude_voice/guard.py"
find = 'if _names_upstream\(url, upstream\):'
replace = 'if False:'

[[rule]]
name = "the event API answers only this computer and the tailnet"
file = "src/claude_voice/api.py"
find = 'if not from_tailnet_or_here\(caller_address\(scope\)\):'
replace = 'if False:'

[[rule]]
name = "a contribute session does not start while something it needs is missing"
file = "src/claude_voice/server.py"
find = 'if blockers:'
replace = 'if False:'

[[rule]]
name = "local changes stop the update before anything is touched"
file = "src/claude_voice/updater.py"
find = 'if not ok or changed:'
replace = 'if not ok:'

[[rule]]
name = "an update whose tests fail is rolled back without a restart"
file = "src/claude_voice/updater.py"
find = 'if not ok:  # roll back'
replace = 'if False:'

[[rule]]
name = "only talking to a session puts it in focus and a look at it does not"
file = "src/claude_voice/api.py"
find = 'event = "focus" if tool in TALK_TOOLS else "peek"'
replace = 'event = "focus"'

[[rule]]
name = "only a well-formed remote control id becomes a link"
file = "src/claude_voice/server.py"
find = 'if not isinstance\(bridge_session_id, str\) or not REMOTE_ID\.fullmatch\(bridge_session_id\):'
replace = 'if not bridge_session_id:'

[[rule]]
name = "a repository that is not owner slash name is refused"
file = "src/claude_voice/config.py"
find = 'if not isinstance\(value, str\) or not REPO\.fullmatch\(value\) or "\.\." in value:'
replace = 'if not isinstance(value, str):'

[[rule]]
name = "an answer that does not fit the prompt is refused"
file = "src/claude_voice/api.py"
find = 'reason = self\._fits\(prompt, body\)'
replace = 'reason = None'

[[rule]]
name = "a way of starting a session that does not exist is refused"
file = "src/claude_voice/config.py"
find = 'if launch not in LAUNCHES:'
replace = 'if False:'

[[rule]]
name = "a setting that does not exist or does not fit is refused"
file = "src/claude_voice/api.py"
find = 'now = self\.settings\.change\(body\)'
replace = 'now = self.settings.get()'

[[rule]]
name = "a started session does not inherit the identity of the session that started it"
file = "src/claude_voice/transcripts.py"
find = 'return \{k: v for k, v in env\.items\(\) if k not in INHERITED\}'
replace = 'return dict(env)'

[[rule]]
name = "a helper counts as running until it has handed back"
file = "src/claude_voice/detail.py"
find = 'if \(background is None and call not in answered\) or \(background is not None and background not in handed_back\)'
replace = 'if background is None and call not in answered'

[[rule]]
name = "a second request for a summary joins the one already running"
file = "src/claude_voice/detail.py"
find = 'if current is not None and not current\.done\(\):'
replace = 'if False:'

[[rule]]
name = "starting the same session twice gives back the one already running"
file = "src/claude_voice/server.py"
find = 'if same is not None:  # a retry after an answer lost on the way must not open a second window'
replace = 'if False:'

[[rule]]
name = "a transcript keeps only what a person reads not tool output"
file = "src/claude_voice/transcripts.py"
find = 'if isinstance\(content, list\):'
replace = 'if False:'

[[rule]]
name = "a refresh token stays usable for a minute after it is spent"
file = "src/claude_voice/oauth.py"
find = '\(self\.clock\(\) \+ REUSE_GRACE, _hash\(refresh_token\.token\)\),'
replace = '(self.clock(), _hash(refresh_token.token)),'

[[rule]]
name = "a window runs Claude Code through the owners login shell"
file = "src/claude_voice/transcripts.py"
find = 'through = \[shell, "-lic", .exec "\$@"., "claude-voice"\] if terminal and shell else \[\]'
replace = 'through = []'

[[rule]]
name = "a time budget that is not a positive number is refused"
file = "src/claude_voice/config.py"
find = 'if isinstance\(value, bool\) or not isinstance\(value, \(int, float\)\) or value <= 0:'
replace = 'if False:'

[[rule]]
name = "a delivery slower than the clients budget is answered as sending"
file = "src/claude_voice/server.py"
find = 'return sending_on\(sid, str\(target\["name"\]\), message, delivery\)'
replace = 'return await delivery'

[[rule]]
name = "a wait never runs past the callers time budget"
file = "src/claude_voice/server.py"
find = 'deadline = started \+ max\(min\(wait_seconds, 300, budget\), 0\)'
replace = 'deadline = started + max(min(wait_seconds, 300), 0)'

[[rule]]
name = "a new folder must be a simple name under the root"
file = "src/claude_voice/server.py"
find = 'if not SIMPLE_FOLDER\.fullmatch\(project\):'
replace = 'if False:'

[[rule]]
name = "the updater reaches github over https not the owners ssh key"
file = "src/claude_voice/updater.py"
find = 'command = \[git, \*OVER_HTTPS, "-C", str\(repo\), \*args\]'
replace = 'command = [git, "-C", str(repo), *args]'

[[rule]]
name = "only a folder the bridge just made is trusted for claude code"
file = "src/claude_voice/server.py"
find = 'trust_folder\(new\)'
replace = 'pass'

[[rule]]
name = "a read that leaves turns for later still shows the newest reply"
file = "src/claude_voice/server.py"
find = 'if left and newest is not None:'
replace = 'if False:'
