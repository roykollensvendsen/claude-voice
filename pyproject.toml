[project]
name = "claude-voice"
version = "0.1.0"
description = "MCP bridge that lets a voice assistant drive local Claude Code sessions"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Roy Kollen Svendsen", email = "roykollensvendsen@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.175",
    "mcp>=2.3.0",
    "psutil>=7",
]

[project.scripts]
claude-voice = "claude_voice.cli:entry"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-psutil>=7.2.2.20260906",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["e2e: needs a real logged-in Claude Code; never run in CI"]
addopts = "-m 'not e2e'"
# A passing test's temporary files are deleted at once, and only the latest run's
# failures are kept to read: a day of runs otherwise filled the machine's /tmp.
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["claude_voice"]
known-third-party = ["fakes"]
