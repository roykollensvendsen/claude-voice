name: checks

# pull_request covers every pull request; push:main covers a direct push to main.
# A commit cannot be both, so the pair never runs the same commit twice.
# A pull request runs Windows, Python 3.13 and the template only when its paths call for
# them (scripts/ci_scope.py). Main and the nightly run always run every job, and catch the rest.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 02.00 Oslo time all year: cron alone is UTC, and the time zone keeps the hour through
    # summer time. It is an hour when no one is waiting on a runner. On the night clocks go
    # forward, 02.00 doesn't exist, so that one run may start late or be skipped; that's accepted.
    - cron: "0 2 * * *"
      timezone: "Europe/Oslo"

# A newer push to a pull request stops that pull request's stale run. Pushes to main share one
# group, so a batch's last merge stops the runs of the merges before it: only its tree, the one
# the batch proved, is checked in full. Every other run, nightly or by hand, is its own group and
# always runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'main-push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

# Nothing here writes to the repository, its issues or its packages.
permissions:
  contents: read

jobs:
  # Which of the slower jobs this run needs: all of them, except on a pull request whose
  # paths none of them is there to catch.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.scope.outputs.windows }}
      python313: ${{ steps.scope.outputs.python313 }}
      template: ${{ steps.scope.outputs.template }}
      quality: ${{ steps.scope.outputs.quality }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0       # the pull request's changed paths are read from its base
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
        run: python3 scripts/ci_scope.py scope

  # Conventional Commits, over the commits this pull request adds.
  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Dependabot writes a body line carrying two full commit hashes, which no
    # length rule survives, and its messages are not a person's to fix.
    # A direct push to main was linted by nothing: the range below only exists
    # on a pull request, so the job skipped itself and the local hook, which
    # --no-verify bypasses, was the only check. The range is now worked out for
    # both events. Dependabot writes a body line carrying two full commit
    # hashes, which no length rule survives, and its messages are not a
    # person's to fix.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0       # committed reads a range, so it needs both ends
      - name: The range this event added
        id: range
        # A branch's first push reports an all-zero "before", and there is
        # nothing to compare against, so fall back to the one commit.
        run: |
          before='${{ github.event.before }}'
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            echo "range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "range=$before..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "${{ github.sha }}^" >/dev/null; then
            # A branch's first push reports an all-zero predecessor, and a force
            # push reports one that no longer exists. Either way there is
            # nothing to compare against, so check the one commit.
            echo "range=${{ github.sha }}~1..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            # The very first commit in a repository has no parent, so no
            # range can name it. Both the linter and the imperative check
            # take a single commit, and that commit is the one most likely
            # to have been written without care.
            echo "range=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: crate-ci/committed@faeed42f2e10c244533a01525f13c4d8b6ce383f # v1.1.11
        with:
          args: --no-merge-commit
          commits: ${{ steps.range.outputs.range }}
      # committed's own imperative rule flags nothing, so this is what does.
      - name: Subjects in the imperative
        run: python scripts/imperative.py ${{ steps.range.outputs.range }}
      # Only the commits this event adds: older history is kept as it is.
      - name: No links to a Claude session
        run: python scripts/no_session_links.py ${{ steps.range.outputs.range }}

  # The suite on Windows, where Claude Code also runs and the bridge must not
  # assume Unix: a signal that only probes a process on Linux ends it there.
  windows:
    needs: scope
    # Runs even when the scope failed, whose outputs are then empty; skipped, it still reports.
    if: ${{ !cancelled() && needs.scope.outputs.windows != 'false' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.12.13"
          python-version: "3.12"
      - run: uv sync --locked --all-extras
      - name: Types
        run: uv run mypy src
      - name: The suite
        run: uv run pytest -q -p no:cacheprovider --strict-markers

  # The README's five-minute start, run on an empty Ubuntu as a stranger would.
  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/clean_install.py

  quality:
    # The ratchet compares with a base, and a nightly run has none, so it never runs at night.
    # An ordinary pull request leaves it out: the mutation run and the ratchet run once, on the
    # batch of approved pull requests (an integration/ branch) that main takes them in. A push
    # to main and dependabot's own pull request still run it. When the scope job failed, its
    # outputs are empty, and quality runs.
    needs: scope
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.scope.outputs.quality != 'false' }}
    runs-on: ubuntu-latest
    # No time limit, on purpose: this job holds the mutation run, which grows with every rule,
    # and a run cut short proves nothing. Never cap it; remove a cap rather than raise it.
    permissions:
      contents: read
      actions: read              # to fetch the levels main kept with its own run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0         # the base is measured in a copy when main's levels are missing
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.12.13"
          python-version: "3.12"
      - run: uv sync --locked --all-extras
      # Main keeps its levels with each of its runs (ADR-CV-009). Missing ones, from a run
      # cancelled or expired, leave no file, and the ratchet then measures the base itself.
      - name: The levels main kept for the base
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow checks.yml --commit "$BASE" \
                         --event push --json databaseId -q '.[].databaseId'); do
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name quality-levels --dir "$RUNNER_TEMP/base" \
              && break
          done
          ls "$RUNNER_TEMP/base" 2>/dev/null || echo "Main kept no levels for $BASE; the ratchet will measure it."
      - name: The quality ratchet
        env:                     # the pull request's text, for its Ratchet-Exception lines
          RATCHET_EXCEPTIONS: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          LEVELS: ${{ runner.temp }}/base/levels.json
          OUT: ${{ runner.temp }}/levels.json
          MUTATIONS: ${{ runner.temp }}/mutations.json
        run: uv run python scripts/ratchet.py check --base "$BASE" --levels "$LEVELS" --out "$OUT" --mutations "$MUTATIONS"
      - name: Keep main's levels with this run
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-levels
          path: ${{ runner.temp }}/levels.json
          if-no-files-found: ignore
      # The same run's mutation report, rule by rule, for the code-health page. A run that
      # measured no mutations (a red suite stops the ratchet first) keeps none.
      - name: Keep main's mutation report with this run
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-mutations
          path: ${{ runner.temp }}/mutations.json
          if-no-files-found: ignore

  # Main requires a "batch" status: a pass of quality on a batch the pull request was part of.
  # Dependabot's pull request is never in a batch, so its own run reports that pass itself, once
  # quality passed on it. This job runs no code from the pull request and checks nothing out; its
  # token may write statuses and nothing else. A person who pushes onto dependabot's branch, or
  # re-runs its run, is not dependabot: the job is skipped, no status is set, and the pull
  # request cannot merge. That fails safe.
  dependabot-batch:
    needs: quality
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && github.triggering_actor == 'dependabot[bot]' && needs.quality.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA"
          -f state=success -f context=batch -f target_url="$RUN"
          -f description="dependabot's own full run passed"

  # The plugin template, rendered under a made-up name into a temporary folder and put through
  # its own gates there, offline: its suite, its mutation run and its ratchet.
  template:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.template != 'false' }}
    runs-on: ubuntu-latest
    # No time limit, on purpose: this job holds the template's mutation run, and a run cut
    # short proves nothing. Never cap it; remove a cap rather than raise it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.12.13"
          python-version: "3.12"
      - run: uv sync --locked --all-extras
      - name: The template's own gates, on a rendered copy
        run: uv run pytest -q -p no:cacheprovider --strict-markers -m template

  # The check tools the plugins share (no-duplicates-v1): a project of its own, with its own lock
  # file, tested once here so no plugin has to carry a copy.
  voice-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/voice-checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.12.13"
          python-version: "3.12"
      - run: uv sync --locked
      - name: Lint and format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy src
      - name: Its own tests
        run: uv run pytest -q -p no:cacheprovider --strict-markers --cov=voice_checks
      - name: Only jobs named as running no tests have a time limit
        run: >-
          uv run voice-checks ci-limits --root ../..
          --no-tests scope --no-tests commits --no-tests dependabot-batch
          --no-tests gate --no-tests auto-merge

  checks:
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # A job that runs the tests has no time limit: caps are removed, never raised (ADR-CV-021).
    strategy:
      fail-fast: false           # one version failing should not hide another
      matrix:                    # every version pyproject.toml claims to support
        python: ["3.12", "3.13"]
    # A matrix leg can't be skipped by itself and still report under its own name, which
    # branch protection requires. So the 3.13 leg always runs, and only its steps are left out.
    env:
      NEEDED: ${{ matrix.python == '3.12' || needs.scope.outputs.python313 != 'false' }}
    steps:
      - name: Whether this version runs here
        run: echo "Python ${{ matrix.python }} needed on this run - ${{ env.NEEDED }}"
      # Actions are pinned to a commit, not a tag, as GitHub's own hardening guide asks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.NEEDED == 'true'
        with:
          fetch-depth: 0         # the last-checked rule reads each page's commit date
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: env.NEEDED == 'true'
        with:
          enable-cache: true     # setup-python's own cache covers pip, not uv
          version: "0.12.13"     # pin uv itself
          python-version: ${{ matrix.python }}
      # From the lock file, so a new release of a tool cannot turn CI red on its
      # own; Dependabot moves the lock deliberately instead.
      - run: uv sync --locked --all-extras
        if: env.NEEDED == 'true'
      - name: Lint and format
        if: env.NEEDED == 'true'
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        if: env.NEEDED == 'true'
        run: uv run mypy src
      - name: The rules that guard the rules
        if: env.NEEDED == 'true'
        # Coverage is measured and printed, with no threshold yet: a number
        # picked before there is data is a guess with a gate on it.
        run: uv run pytest -q -p no:cacheprovider --strict-markers --cov

  # The one job a branch rule can require instead of the many: it passes only when every
  # other job passed, or was left out because the scope said so.
  gate:
    needs: [scope, commits, windows, clean-install, quality, template, voice-checks, checks]
    if: ${{ always() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          NEEDS: ${{ toJSON(needs) }}
          ACTOR: ${{ github.actor }}
        run: python3 scripts/ci_scope.py gate
