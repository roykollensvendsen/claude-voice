[project]
name = "claude-voice-power"
version = "0.1.0"
description = "A small service that shuts a machine down only on a yes signed by the hub"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = ["jeepney>=0.9.0", "cryptography>=46"]

[project.scripts]
claude-voice-power = "claude_voice_power.__main__:entry"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
