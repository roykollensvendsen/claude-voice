# Display titles for the bridge's tools: the short plain name a client such as
# the Claude app shows instead of the code name, for example when it asks the
# owner before running a tool.
#
# One table for this repository and its forks. It may name tools a given copy
# does not have; each copy adds the tools it introduces, so a title written once
# is the same everywhere. No two tools share a title.

[titles]
approve = "Approve a pending tool call"
ask_active_session = "Ask an open session and wait"
ask_forked_session = "Ask the side session and wait"
attach_conversation = "Continue an earlier conversation"
cancel = "Stop a session's current turn"
check_dependencies = "Check what the bridge is missing"
close_session = "Retire a bridge session"
create_session = "Create a bridge session in a project"
deny = "Refuse a pending tool call"
digest_session = "Sum up a session's conversation"
fleet_recap = "Show what every session is doing"
get_active_session = "Show the session the owner talks to"
guide = "Read the bridge's manual"
hand_to_desktop = "Move a session into the desktop app"
health = "Check the bridge's health"
list_active_sessions = "List the sessions running now"
list_claude_conversations = "List recent conversations"
list_pending_approvals = "List tool calls awaiting approval"
list_projects = "List recent project folders"
list_sessions = "List the bridge's sessions"
message_active_session = "Send a message to an open session"
message_forked_session = "Send the side session a question"
peek_session = "Take a quick look at a session"
read_forked_session = "Read the side session's answer"
read_session_output = "Read an open session's latest turns"
request_access = "Ask the owner to open a folder"
revoke_access = "Close an opened folder again"
search_session_history = "Search a session's conversation"
send_task = "Send a task to a bridge session"
session_recap = "Show a bridge session's status"
session_tree = "Show the tree of sessions"
set_active_session = "Choose the session the owner talks to"
side_question = "Ask a quick side question about a session"
start_active_session = "Start a background session"
start_role = "Start a session for a role"
stop_active_session = "Stop a background session"
wait_for_session = "Wait for a session's turn to end"
whats_new = "Check for news since last time"
